<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- Typed.js -->
<script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

<style>
:root {
    --bg-dark: #0a0a0a;
    --mint-green: #1fd691;
    --mint-hover: #19b37a;
}

body {
    background: var(--bg-dark);
    color: white;
    font-family: 'Inter', sans-serif;
}

/* NAVBAR */
.nav-link {
    color: rgba(255,255,255,0.7) !important;
}
.nav-link:hover {
    color: var(--mint-green) !important;
}

/* HERO */
.hero-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    text-align: center;
}

h1 {
    font-size: clamp(2.5rem, 8vw, 5rem);
}

.role-text {
    font-size: 1.2rem;
    letter-spacing: 2px;
}

/* BUTTONS */
.btn-mint {
    background: var(--mint-green);
    color: black;
    border-radius: 10px;
}
.btn-mint:hover {
    background: var(--mint-hover);
}

.btn-outline-light {
    border-radius: 10px;
}

/* SIDEBAR */
.social-sidebar {
    position: fixed;
    top: 50%;
    left: 10px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.social-sidebar a {
    width: 40px;
    height: 40px;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: white;
}

.social-sidebar a:hover {
    background: var(--mint-green);
    color: black;
}

/* SECTION TITLE */
.section-title {
    font-size: 2rem;
}
.title-underline {
    width: 50px;
    height: 4px;
    background: var(--mint-green);
}

/* CARDS */
.card-box {
    background: #0d1117;
    border-radius: 12px;
    padding: 20px;
}

/* SKILLS SCROLL */
.skills-slider {
    overflow: hidden;
}

.skills-track {
    display: flex;
    gap: 20px;
    animation: scroll 20s linear infinite;
}

.skill-card {
    min-width: 150px;
    height: 150px;
    background: #0d1117;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 12px;
}

.skill-card i {
    font-size: 2rem;
    color: var(--mint-green);
}

@keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

/* MOBILE FIXES */
@media(max-width:768px){
    .social-sidebar {
        display: none;
    }

    .hero-section {
        padding: 60px 20px;
    }

    .role-text {
        font-size: 1rem;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#">About</a></li>
<li class="nav-item"><a class="nav-link" href="#">Skills</a></li>
<li class="nav-item"><a class="nav-link" href="#">Projects</a></li>
<li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
</ul>
</div>
</div>
</nav>

<!-- SIDEBAR -->
<div class="social-sidebar">
<a href="#"><i class="fab fa-linkedin-in"></i></a>
<a href="#"><i class="fab fa-github"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-whatsapp"></i></a>
</div>

<!-- HERO -->
<section class="hero-section">
<div class="container">
<h1>Hello, I'm <span style="color:var(--mint-green)">Dilshan</span></h1>
<p class="role-text"><span id="typed-text"></span></p>

<div class="mt-4 d-flex justify-content-center gap-3 flex-wrap">
<a href="#" class="btn btn-mint px-4 py-2">Projects</a>
<a href="#" class="btn btn-outline-light px-4 py-2">Resume</a>
</div>
</div>
</section>

<!-- ABOUT -->
<section class="py-5 container">
<h2 class="section-title">About</h2>
<div class="title-underline mb-4"></div>

<div class="card-box">
<p>I am a Full Stack Developer building modern web apps.</p>
</div>
</section>

<!-- SKILLS -->
<section class="py-5 container">
<h2 class="section-title">Skills</h2>
<div class="title-underline mb-4"></div>

<div class="skills-slider">
<div class="skills-track">
<div class="skill-card"><i class="fab fa-html5"></i><span>HTML</span></div>
<div class="skill-card"><i class="fab fa-css3-alt"></i><span>CSS</span></div>
<div class="skill-card"><i class="fab fa-js"></i><span>JS</span></div>
<div class="skill-card"><i class="fab fa-react"></i><span>React</span></div>
<div class="skill-card"><i class="fab fa-python"></i><span>Python</span></div>
</div>
</div>
</section>

<!-- FOOTER -->
<footer class="text-center py-4">
<p>© 2026 Dilshan</p>
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    new Typed('#typed-text', {
        strings: ['Full Stack Developer', 'UI/UX Designer', 'Freelancer'],
        typeSpeed: 50,
        backSpeed: 30,
        loop: true
    });
});
</script>

</body>
</html>

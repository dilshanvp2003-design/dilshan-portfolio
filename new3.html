<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dilshan Portfolio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

<style>
:root {
--bg-dark:#0a0a0a;
--mint:#1fd691;
}

body{
background:var(--bg-dark);
color:white;
font-family:'Inter',sans-serif;
}

.section{padding:80px 0;}

.section-title{text-align:center;margin-bottom:50px;}

.text-mint{color:var(--mint);}

/* SIDEBAR */
.social-sidebar{
position:fixed;
top:50%;
left:20px;
transform:translateY(-50%);
display:flex;
flex-direction:column;
gap:15px;
z-index:999;
}

.social-sidebar a{
width:45px;height:45px;
display:flex;align-items:center;justify-content:center;
background:#0d1117;
border-radius:50%;
color:white;
transition:.3s;
}

.social-sidebar a:hover{
background:var(--mint);
color:black;
}

.card{
background:#0d1117;
border:1px solid rgba(255,255,255,0.05);
color:white;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="social-sidebar">
<a href="#"><i class="fab fa-linkedin-in"></i></a>
<a href="#"><i class="fab fa-github"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-whatsapp"></i></a>
<a href="#"><i class="fas fa-envelope"></i></a>
<a href="#"><i class="fas fa-code"></i></a>
</div>

<!-- HERO -->
<section class="section text-center">
<div class="container">
<h1>Hello I'm <span class="text-mint">Dilshan VP</span></h1>
<h4><span id="typed-text"></span></h4>
</div>
</section>

<!-- ABOUT -->
<section class="section">
<div class="container">
<div class="section-title"><h2>About Me</h2></div>
<div class="card p-4 text-center">Full Stack Developer</div>
</div>
</section>

<!-- SKILLS -->
<section class="section">
<div class="container">
<div class="section-title"><h2>Skills</h2></div>
<div class="row g-4 text-center">
<div class="col-md-3"><div class="card p-3">HTML</div></div>
<div class="col-md-3"><div class="card p-3">CSS</div></div>
<div class="col-md-3"><div class="card p-3">Python</div></div>
<div class="col-md-3"><div class="card p-3">Django</div></div>
</div>
</div>
</section>

<!-- SERVICES -->
<section class="section">
<div class="container">
<div class="section-title"><h2>Services</h2></div>
<div class="row g-4">
<div class="col-md-6"><div class="card p-3">Full Stack Development</div></div>
<div class="col-md-6"><div class="card p-3">Backend Development</div></div>
</div>
</div>
</section>

<!-- EDUCATION -->
<section class="section">
<div class="container">
<div class="section-title"><h2>Education</h2></div>
<div class="card p-3 text-center">Diploma in Software Engineering</div>
</div>
</section>

<!-- PROJECTS -->
<section class="section">
<div class="container">
<div class="section-title"><h2>Projects</h2></div>
<div class="row g-4">
<div class="col-md-6"><div class="card p-3">Ecommerce</div></div>
<div class="col-md-6"><div class="card p-3">Task App</div></div>
</div>
</div>
</section>

<!-- CONTACT -->
<section class="section">
<div class="container">
<div class="section-title"><h2>Contact</h2></div>
<div class="card p-4">
<input class="form-control mb-2" placeholder="Name">
<input class="form-control mb-2" placeholder="Email">
<textarea class="form-control mb-2" placeholder="Message"></textarea>
<button class="btn btn-success w-100">Send</button>
</div>
</div>
</section>

<script>
new Typed('#typed-text', {
strings:['Full Stack Developer','UI/UX Designer','Freelancer'],
typeSpeed:50,
backSpeed:30,
loop:true
});
</script>

</body>
</html>
